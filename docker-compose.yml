services:
  # Vite scaffold from the initial project setup. Kept until the team decides
  # which frontend to carry forward (see storefront/).
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  # Next.js storefront: the Karamtech catalogue, cart and checkout.
  storefront:
    build: ./storefront
    ports:
      - "3000:3000"
    volumes:
      - ./storefront:/app
      - /app/node_modules
      - /app/.next

  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
